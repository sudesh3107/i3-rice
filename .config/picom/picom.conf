## BreadOnPenguins-style picom (goldenbrown), picom v10 compatible

# OPACITY
inactive-opacity = 0.85;

# ROUNDED CORNERS (user wants square corners everywhere)
corner-radius = 0
rounded-corners-exclude = [ "window_type = 'dock'" ];

# BLURRING
blur:
{
  method = "dual_kawase";
  size = 10;
  strength = 3;
};

# semi-transparent
blur-background = true

# Use fixed blur strength rather than adjusting according to window opacity.
blur-background-fixed = true

# SHADOWS
shadow = true;
shadow-radius = 1;
shadow-opacity = 0.6;

shadow-offset-x = 0;
shadow-offset-y = 0;

shadow-color = "#443c40"

# FADING
fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 3

# OTHER SETTINGS
backend = "glx";

dithered-present = false;
vsync = true;

detect-rounded-corners = false
detect-client-opacity = true;
use-ewmh-active-win = true
detect-transient = true;
use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.5; focus = true; full-shadow = false; };
  dock = { shadow = false; };
  popup_menu = { opacity = 0.7; };
  dropdown_menu = { opacity = 0.7; };
  normal = { opacity = 1.0; };
};